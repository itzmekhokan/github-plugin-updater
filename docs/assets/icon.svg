<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="github-plugin-updater logo">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <!-- badge -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="#0b1220"/>
  <rect x="6" y="6" width="116" height="116" rx="28" fill="none" stroke="url(#g)" stroke-width="2" opacity=".45"/>

  <!-- update / sync: two arcing arrows orbiting the piece -->
  <g fill="none" stroke="url(#g)" stroke-width="7" stroke-linecap="round">
    <path d="M25 50 A42 42 0 0 1 103 50"/>
    <path d="M103 78 A42 42 0 0 1 25 78"/>
  </g>
  <!-- arrowheads, tangent to each arc's clockwise end -->
  <path d="M106.4 59.4 L111.5 46.9 L94.5 53.0 Z" fill="url(#g)"/>
  <path d="M21.6 68.6 L16.5 81.1 L33.5 75.0 Z" fill="url(#g)"/>

  <!-- plugin: a puzzle piece with a tab (top) and a socket (right) -->
  <path d="M49 53
           L58 53 C58 45 70 45 70 53
           L79 53 L79 62 C71 62 71 74 79 74
           L79 80 L49 80 Z"
        fill="url(#g)" stroke="#0b1220" stroke-width="2" stroke-linejoin="round"/>
</svg>
